<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Armaan Mujawar | Digital Artist & Creative Developer</title>
  <meta name="description" content="Interactive 2D pixel-art studio portfolio of Armaan Mujawar. Walk around, explore 3D branding, esports keyart, and live GitHub terminals.">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png">
  <meta name="theme-color" content="#161b2e">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Silkscreen&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game" tabindex="0" aria-label="Pixel studio — walk with WASD or arrow keys, press E to interact"></canvas>

  <!-- HUD -->
  <div id="hud">
    <div class="who">
      <div class="avatar"></div>
      <div class="who-text">
        <b id="profile-name">Armaan Mujawar</b>
        <small id="profile-role">Digital Artist · Creative Developer</small>
        <div class="progress-row"><div class="progress"><div id="progress-bar"></div></div><small id="progress-text" class="progress-text"></small></div>
      </div>
    </div>
    <div class="buttons">
      <button class="pixel-btn" id="btn-menu" title="Quick menu (skip the walking)">☰ <span>Menu</span></button>
      <button class="pixel-btn icon" id="btn-night" title="Night mode (N)">☾</button>
      <button class="pixel-btn icon" id="btn-music" title="Music (M)">♪</button>
      <button class="pixel-btn icon on" id="btn-sound" title="Sound effects">🔊</button>
    </div>
    <!-- on-screen controls: click/hold or touch; they also light up when the keyboard is used -->
    <div id="pad" aria-label="Movement controls">
      <div class="dpad">
        <button class="up" data-key="w" aria-label="Walk up (W / ↑)"><span>▲</span><kbd>W</kbd></button>
        <button class="left" data-key="a" aria-label="Walk left (A / ←)"><span>◀</span><kbd>A</kbd></button>
        <button class="down" data-key="s" aria-label="Walk down (S / ↓)"><span>▼</span><kbd>S</kbd></button>
        <button class="right" data-key="d" aria-label="Walk right (D / →)"><span>▶</span><kbd>D</kbd></button>
      </div>
      <div class="actions">
        <button class="act" id="pad-e" data-key="e" aria-label="Interact (E)">E<small>use</small></button>
        <button class="run" data-key="shift" aria-label="Hold to run (Shift)">⇧<small>run</small></button>
      </div>
    </div>
  </div>

  <!-- quick menu -->
  <div id="menu" class="modal" hidden>
    <div class="sheet">
      <header><span class="icon">☰</span><div><h2>Quick menu</h2><small>In a hurry? Pick a spot and I'll walk there.</small></div><button class="close" aria-label="Close">✕</button></header>
      <div class="menu-list"></div>
    </div>
  </div>

  <!-- content panel -->
  <div id="panel" class="modal" hidden>
    <div class="sheet" role="dialog" aria-modal="true">
      <button class="close" aria-label="Close">✕</button>
      <div id="panel-body"></div>
    </div>
  </div>

  <div id="toasts"></div>

  <script src="assets/sprites.js"></script>
  <script src="js/content.js"></script>
  <script src="js/world.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
